services:
  db:
    image: postgres:16-alpine
    container_name: echo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports:
      # Porta do host configurável via DB_PORT (padrão 5432).
      # Troque no seu .env se a 5432 já estiver ocupada na sua máquina.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - echo_pgdata:/var/lib/postgresql/data

  # Banco exclusivo dos testes: sem volume (os dados somem ao derrubar) e só sobe
  # com o profile "test", para não interferir no banco de desenvolvimento.
  db-test:
    image: postgres:16-alpine
    container_name: echo-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo_test
    ports:
      - "${DB_TEST_PORT:-5435}:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  echo_pgdata:
